[project]
name = "customer-decision-analytics"
version = "0.1.0"
description = "Conjoint pricing, causal offer impact, MDS positioning and marketing mix modeling on a subscription launch case study"
requires-python = ">=3.12"
dependencies = [
    "gower>=0.1.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
